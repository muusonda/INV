<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A privacy-safe, browser based invoice editor.">
  <title>INV — Invoice editor</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">INV</p>
      <h1>Invoice editor</h1>
    </div>
    <div class="toolbar" aria-label="Invoice actions">
      <button id="new-invoice" class="secondary">New</button>
      <label class="button secondary" for="import-file">Import</label>
      <input id="import-file" type="file" accept=".json,.txt,.csv,application/json,text/plain,text/csv" hidden>
      <button id="save-invoice" class="primary">Save invoice</button>
      <button id="export-invoice" class="secondary">Export PDF / Print</button>
    </div>
  </header>

  <main class="workspace">
    <section class="editor" aria-label="Invoice details">
      <div id="status" class="status" role="status">Ready</div>

      <section class="panel">
        <div class="panel-heading"><h2>Invoice</h2><span id="saved-label" class="muted"></span></div>
        <div class="grid two">
          <label>Document number<input id="document-number" autocomplete="off" placeholder="INV-001"></label>
          <label>Issue date<input id="issue-date" type="date"></label>
          <label>Due date<input id="due-date" type="date"></label>
          <label>Currency<input id="currency" maxlength="3" placeholder="ZAR"></label>
          <label>Tax rate (%)<input id="tax-rate" type="number" min="0" step="0.01" placeholder="0"></label>
          <label>Payment plan<select id="payment-plan"><option>Single</option><option>50/50</option></select></label>
        </div>
        <label>Payment terms<textarea id="payment-terms" rows="3" placeholder="Payment terms shown on the invoice"></textarea></label>
      </section>

      <section class="panel">
        <h2>Your details</h2>
        <div class="grid two">
          <label>Name or business<input id="sender-name" autocomplete="organization" placeholder="Your name or business name"></label>
          <label>Email<input id="sender-email" type="email" autocomplete="email" placeholder="name@example.com"></label>
          <label>Phone<input id="sender-phone" autocomplete="tel" placeholder="Phone number"></label>
          <label>Address<textarea id="sender-address" rows="3" autocomplete="street-address" placeholder="Business address"></textarea></label>
          <label class="full">Banking details<textarea id="banking-details" rows="4" placeholder="Add payment details before issuing an invoice"></textarea></label>
        </div>
      </section>

      <section class="panel">
        <h2>Client details</h2>
        <div class="grid two">
          <label>Name or business<input id="client-name" autocomplete="name" placeholder="Client name or business"></label>
          <label>Email<input id="client-email" type="email" autocomplete="email" placeholder="client@example.com"></label>
          <label>Phone<input id="client-phone" autocomplete="tel" placeholder="Phone number"></label>
          <label>Address<textarea id="client-address" rows="3" autocomplete="street-address" placeholder="Client billing address"></textarea></label>
          <label class="full">Project or description<input id="project-description" placeholder="What this invoice is for"></label>
        </div>
      </section>

      <section class="panel">
        <div class="panel-heading"><h2>Line items</h2><button id="add-line" class="secondary small">Add line</button></div>
        <div id="line-items" class="line-items"></div>
      </section>

      <section class="panel">
        <div class="panel-heading"><h2>Saved invoices</h2><span class="muted">Stored only in this browser</span></div>
        <div id="saved-invoices" class="saved-invoices"><p class="muted">No saved invoices yet.</p></div>
      </section>
    </section>

    <section class="preview-wrap" aria-label="Invoice preview">
      <div class="preview-heading"><h2>Preview</h2><span class="muted">White background for printing</span></div>
      <div id="invoice-preview"></div>
    </section>
  </main>

  <script src="app.js?v=96b1b39"></script>
</body>
</html>
